name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  build:
    runs-on: ubuntu-latest

    # PostgreSQL with pgvector, for the integration tests in ContextSmith.Persistence.Postgres.Tests.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: test # pragma: allowlist secret (throwaway CI container)
          POSTGRES_DB: contextsmith
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      # -warnaserror:CS1591 keeps missing XML doc comments a build failure even if the
      # .editorconfig severity is loosened. See issue #26.
      - name: Build
        run: dotnet build --no-restore --configuration Release -warnaserror:CS1591

      - name: Test
        run: dotnet test --no-build --configuration Release
        env:
          CONTEXTSMITH_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=test;Database=contextsmith # pragma: allowlist secret

      # Proves the container image still builds. Nothing is pushed.
      - name: Build container image
        run: docker build --tag contextsmith-mcp .
